services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: bolsasim
      POSTGRES_USER: bolsasim
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsasim -d bolsasim"]
      interval: 2s
      timeout: 3s
      retries: 30
  db-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: bolsasim_test
      POSTGRES_USER: bolsasim
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsasim -d bolsasim_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
